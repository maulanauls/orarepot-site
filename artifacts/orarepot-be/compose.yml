name: orarepot-be

# Default: Postgres + Redis + Kafka di 84.247.149.27 (lihat .env)
# Infra lokal opsional: docker compose --profile local-infra --profile local-kafka up -d

x-app-env: &app-env
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_KEY: ${INTERNAL_KEY}

services:
  postgres:
    profiles: [local-infra]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orarepot
      POSTGRES_PASSWORD: orarepot
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-create-databases.sh:/docker-entrypoint-initdb.d/00-create-databases.sh:ro
      - ./db:/docker-entrypoint-initdb.d/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orarepot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: [local-infra]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    profiles: [local-kafka]
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 4L6g3nSqQpOx4F7SDpY3LQ
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  identity:
    build:
      context: ./rust
      args:
        CRATE: identity
    env_file: .env
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL_IDENTITY}
      BIND: 0.0.0.0:8101
      RUST_LOG: info
    ports: ["8101:8101"]

  billing:
    build:
      context: ./rust
      args:
        CRATE: billing
    env_file: .env
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL_BILLING}
      BIND: 0.0.0.0:8102
      RUST_LOG: info
    ports: ["8102:8102"]

  otp:
    build:
      context: ./rust
      args:
        CRATE: otp
    env_file: .env
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL_OTP}
      TEMPLATES_URL: http://templates:8203
      BILLING_URL: http://billing:8102
      WHATSAPP_STUB: ${WHATSAPP_STUB:-false}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-1241209412413230}
      META_OTP_TEMPLATE_EN: ${META_OTP_TEMPLATE_EN:-otp_merchant}
      META_OTP_TEMPLATE_EN_LANG: ${META_OTP_TEMPLATE_EN_LANG:-en}
      META_OTP_TEMPLATE_ID: ${META_OTP_TEMPLATE_ID:-otp_merchant_id}
      META_OTP_TEMPLATE_ID_LANG: ${META_OTP_TEMPLATE_ID_LANG:-id}
      META_WA_TOKEN: ${META_WA_TOKEN}
      BIND: 0.0.0.0:8103
      RUST_LOG: info
    depends_on:
      billing:
        condition: service_started
      templates:
        condition: service_started
    ports: ["8103:8103"]

  members:
    build:
      context: ./node
    command: ["node", "dist/members/main.js"]
    env_file: .env
    environment:
      <<: *app-env
      SERVICE_NAME: orarepot-members
      DATABASE_URL: ${DATABASE_URL_MEMBERS}
      PORT: 8201
    ports: ["8201:8201"]

  merchant:
    build:
      context: ./node
    command: ["node", "dist/merchant/main.js"]
    env_file: .env
    environment:
      <<: *app-env
      SERVICE_NAME: orarepot-merchant
      DATABASE_URL: ${DATABASE_URL_MERCHANT}
      PORT: 8202
    ports: ["8202:8202"]

  templates:
    build:
      context: ./node
    command: ["node", "dist/templates/main.js"]
    env_file: .env
    environment:
      <<: *app-env
      SERVICE_NAME: orarepot-templates
      DATABASE_URL: ${DATABASE_URL_TEMPLATES}
      PORT: 8203
    ports: ["8203:8203"]

  developer:
    build:
      context: ./node
    command: ["node", "dist/developer/main.js"]
    env_file: .env
    environment:
      <<: *app-env
      SERVICE_NAME: orarepot-developer
      DATABASE_URL: ${DATABASE_URL_DEVELOPER}
      OTP_URL: http://otp:8103
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-plain}
      KAFKA_SSL: ${KAFKA_SSL:-false}
      PORT: 8204
    ports: ["8204:8204"]

  reporting:
    build:
      context: ./node
    command: ["node", "dist/reporting/main.js"]
    env_file: .env
    environment:
      <<: *app-env
      SERVICE_NAME: orarepot-reporting
      DATABASE_URL: ${DATABASE_URL_WAREHOUSE}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-plain}
      KAFKA_SSL: ${KAFKA_SSL:-false}
      PORT: 8205
    ports: ["8205:8205"]

  relay:
    build:
      context: ./node
    command: ["node", "dist/relay/main.js"]
    env_file: .env
    environment:
      PGHOST: ${POSTGRES_HOST}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME:-}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-plain}
      KAFKA_SSL: ${KAFKA_SSL:-false}

  gateway:
    build:
      context: ./gateway
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_URI: http://identity:8101
      MEMBERS_URI: http://members:8201
      MERCHANT_URI: http://merchant:8202
      BILLING_URI: http://billing:8102
      TEMPLATES_URI: http://templates:8203
      OTP_URI: http://otp:8103
      DEVELOPER_URI: http://developer:8204
      REPORTING_URI: http://reporting:8205
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_started

volumes:
  pgdata:
